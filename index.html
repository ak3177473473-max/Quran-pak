<script>
function base64ToBytes(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
}

function base64UrlToBytes(value) {
    let normalized = value.replace(/-/g, "+").replace(/_/g, "/");
    while (normalized.length % 4) normalized += "=";
    return base64ToBytes(normalized);
}

function hexToBytes(value) {
    if (value.length % 2 !== 0) throw new Error("Invalid hexadecimal payload.");
    const bytes = new Uint8Array(value.length / 2);
    for (let i = 0; i < bytes.length; i++) bytes[i] = Number.parseInt(value.slice(i * 2, i * 2 + 2), 16);
    return bytes;
}

function decodeEncryptedPayload(value, encoding) {
    switch (encoding) {
        case "base64": return base64ToBytes(value);
        case "base64url": return base64UrlToBytes(value);
        case "hex": return hexToBytes(value);
        case "decimal": return Uint8Array.from(value.split(",").map(Number));
        default: throw new Error("Unknown encoding.");
    }
}

function rot13Bytes(bytes) {
    const out = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) {
        const b = bytes[i];
        if (b >= 65 && b <= 90) out[i] = 65 + (b - 65 + 13) % 26;
        else if (b >= 97 && b <= 122) out[i] = 97 + (b - 97 + 13) % 26;
        else out[i] = b;
    }
    return out;
}

function rot47Bytes(bytes) {
    const out = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) {
        const b = bytes[i];
        out[i] = (b >= 33 && b <= 126) ? 33 + (b - 33 + 47) % 94 : b;
    }
    return out;
}

async function decryptPayload(ciphertext, config) {
    switch (config.method) {
        case "rot13": return rot13Bytes(ciphertext);
        case "rot47": return rot47Bytes(ciphertext);
        case "none":  return ciphertext;
        default: throw new Error("Unknown method.");
    }
}

async function decompressBytes(bytes) {
    if (!("DecompressionStream" in window)) throw new Error("This browser cannot decompress the payload.");
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
}
